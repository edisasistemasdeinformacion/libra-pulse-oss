auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_lookback: 720h
  retention_period: 720h

  # Ingesta OTLP nativa (POST /otlp/v1/logs) — la usan los logs de libra7.
  # Estos atributos de resource pasan a etiqueta de índice; todo lo demás
  # (resto de resource attributes y TODOS los atributos de registro) queda
  # como structured metadata: consultable con `| clave="valor"` y sin coste
  # de cardinalidad. service.name y deployment.environment.name ya son
  # índice por defecto; se listan para que el contrato quede escrito aquí.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - deployment.environment.name
            - libra.codigo_instalacion

compactor:
  working_directory: /data/loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093